name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate toolkit
        run: python3 validate.py
      - name: Verify bundle assembly
        run: python3 bundle.py --selftest
      - name: Verify offline reachability controls
        run: python3 linkcheck.py --selftest
      - name: Run regression and negative-control tests
        run: python3 -m unittest discover -s tests -v
      - name: Confirm no generated output was committed
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files build/)"
